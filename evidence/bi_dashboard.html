<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Горизонт — BI dashboard</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font-family:Arial,sans-serif;margin:28px;background:#f5f7fa;color:#1f2937}.head{display:flex;justify-content:space-between;align-items:center}.cards{display:flex;gap:14px;margin:22px 0}.card{background:white;border-radius:12px;padding:18px 24px;box-shadow:0 2px 8px #0001;min-width:170px}.v{font-size:28px;font-weight:700;margin-top:8px}.chart{background:white;border-radius:12px;margin:18px 0;padding:10px;box-shadow:0 2px 8px #0001}.note{font-size:13px;color:#667085}</style></head><body><div class="head"><div><h1>Сеть «Горизонт» — Sales BI</h1><div class="note">Валидационный BI-экран на данных проекта</div></div><div class="note">Период: 27–28.09.2026</div></div><div class="cards"><div class="card">Продажи<div class="v">1,040 ₽</div></div><div class="card">Чеков<div class="v">5</div></div><div class="card">Средний чек<div class="v">208 ₽</div></div><div class="card">Reconciliation<div class="v">0.00</div></div></div><div class="chart" id="daily"></div><div class="chart" id="products"></div><div class="note">Примечание: это локальный HTML/Plotly evidence-экран, а не скриншот работающего Power BI/Metabase/Superset.</div><script>Plotly.newPlot('daily',[{x:['2026-09-27', '2026-09-28'],y:[610.0, 430.0],type:'bar',text:[610.0, 430.0],textposition:'auto'}],{title:'Динамика продаж по дням',xaxis:{title:'Дата'},yaxis:{title:'Продажи, ₽'}},{responsive:true});Plotly.newPlot('products',[{x:['P001', 'P002', 'P004', 'P003', 'P005'],y:[360.0, 240.0, 200.0, 150.0, 90.0],type:'bar',text:[360.0, 240.0, 200.0, 150.0, 90.0],textposition:'auto'}],{title:'Top-10 товаров по продажам',xaxis:{title:'Товар'},yaxis:{title:'Продажи, ₽'}},{responsive:true});</script></body></html>
